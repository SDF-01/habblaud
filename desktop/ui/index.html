<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habblaud</title>
    <style>
      :root {
        color-scheme: dark;
        --bg0: #0f141d;
        --bg1: #171e2b;
        --ink: #e8eef8;
        --muted: #9aa8bd;
        --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", "Trebuchet MS", sans-serif;
        background:
          radial-gradient(900px 500px at 15% 0%, rgba(56, 189, 248, 0.18), transparent 60%),
          radial-gradient(700px 420px at 90% 20%, rgba(240, 138, 60, 0.12), transparent 55%),
          linear-gradient(160deg, var(--bg0), var(--bg1));
        color: var(--ink);
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.4rem;
        font-size: clamp(2rem, 4vw, 3rem);
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        color: var(--muted);
        max-width: 34rem;
        line-height: 1.5;
      }
      .pulse {
        width: 0.85rem;
        height: 0.85rem;
        margin: 1.4rem auto 0;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.55);
        animation: pulse 1.4s ease-out infinite;
      }
      @keyframes pulse {
        70% { box-shadow: 0 0 0 14px rgba(56, 189, 248, 0); }
        100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Habblaud</h1>
        <p>Starting the virtual office desktop app and waiting for the local server…</p>
        <div class="pulse" aria-hidden="true"></div>
      </div>
    </main>
  </body>
</html>
